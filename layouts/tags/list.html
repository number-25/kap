<div class="container">
{{ partial "header.html" . }}
<section>
<h1 class="title is-3"> Tag: {{ .Title }}</h1>
<ul>
{{ range .Pages }}
<li>
<h3>
    <a href="{{ .Permalink }}">{{ .Title }}  </a> <sup><time>{{ .Date.Format (.Site.Params.dateform | default "January 2006") }}</time> </sup>
</h3>
</li>
{{ end }}
</ul>
</section>
{{ partial "footer.html" . }}
</div>
